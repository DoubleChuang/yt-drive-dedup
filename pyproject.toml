[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-drive-dedup"
version = "2.0.0"
description = "找出 Google Drive 裡已上傳到 YouTube 的重複影片並刪除"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["dependencies"]
keywords = ["google-drive", "youtube", "deduplication", "storage"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
yt-drive-dedup = "ytdd.presentation.cli:main"
yt-drive-dedup-auth = "ytdd.presentation.auth_cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["ytdd*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]
